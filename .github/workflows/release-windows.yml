name: Release Windows x64

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure, build, test
        shell: msys2 {0}
        run: |
          export PATH=/ucrt64/bin:/usr/bin:$PATH
          cmake -S . -B build -G Ninja
          cmake --build build --config Release
          ctest --test-dir build --output-on-failure

      - name: Package release zip
        shell: powershell
        run: |
          $stageDir = "stage\jdrive64-windows-x64"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item -LiteralPath "build\jdrive64.exe" -Destination $stageDir -Force
          Copy-Item -LiteralPath "README.md" -Destination $stageDir -Force
          Copy-Item -LiteralPath "CHANGELOG.md" -Destination $stageDir -Force
          Copy-Item -LiteralPath "VERSION" -Destination $stageDir -Force
          if (Test-Path -LiteralPath "jdrive64-windows-x64.zip") {
            Remove-Item -LiteralPath "jdrive64-windows-x64.zip" -Force
          }
          Compress-Archive -Path "$stageDir\*" -DestinationPath "jdrive64-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jdrive64-windows-x64
          path: jdrive64-windows-x64.zip

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: jdrive64-windows-x64.zip
          body: |
            Windows x64 release package.

            Included:
            - jdrive64.exe
            - README.md
            - CHANGELOG.md
            - VERSION

            Notes:
            - Build/test performed in CI (UCRT64 toolchain)
            - Runtime is linked statically for MinGW libgcc/libstdc++
