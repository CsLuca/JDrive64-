<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#182848"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ee7df"/>
      <stop offset="100%" stop-color="#b490ca"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <circle cx="1060" cy="80" r="120" fill="#8ec5fc33" filter="url(#soft)"/>
  <circle cx="220" cy="330" r="140" fill="#e0c3fc2e" filter="url(#soft)"/>

  <g transform="translate(760,85)">
    <rect x="0" y="0" width="360" height="220" rx="16" fill="#f6f2de" stroke="#2f2f2f" stroke-width="6"/>
    <rect x="18" y="26" width="324" height="18" rx="3" fill="#2f2f2f"/>
    <rect x="45" y="95" width="270" height="10" rx="2" fill="#181818"/>
    <rect x="38" y="150" width="290" height="42" rx="4" fill="#bdb59f"/>
    <circle cx="302" cy="168" r="7" fill="#d62828"/>
    <rect x="58" y="164" width="82" height="10" rx="2" fill="#3766b3"/>
  </g>

  <text x="90" y="145" fill="#ffffff" font-size="62" font-weight="800"
        font-family="Segoe UI, Arial, sans-serif">Luca Biondi</text>
  <text x="90" y="200" fill="#cfe8ff" font-size="30" font-weight="600"
        font-family="Segoe UI, Arial, sans-serif">Building JDrive64</text>
  <text x="90" y="242" fill="#b8c8ff" font-size="24"
        font-family="Consolas, 'Courier New', monospace">Commodore D64 on Windows Explorer</text>

  <rect x="90" y="275" width="480" height="4" rx="2" fill="url(#glow)"/>

  <text x="90" y="325" fill="#e5edff" font-size="22"
        font-family="Segoe UI, Arial, sans-serif">Emulation • Utilities • Compression • Open tools</text>
</svg>
